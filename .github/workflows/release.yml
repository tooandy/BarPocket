name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          if [[ "$VERSION" != "$APP_VERSION" ]]; then
            echo "Tag $RELEASE_TAG does not match Info.plist version $APP_VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build, self-test, and ad-hoc sign
        run: ./build.sh

      - name: Verify app signature
        run: codesign --verify --deep --strict dist/BarPocket.app

      - name: Create ZIP, DMG, and checksums
        run: Scripts/package.sh "$VERSION"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/BarPocket-${VERSION}-arm64.zip" \
            "dist/BarPocket-${VERSION}-arm64.dmg" \
            "dist/SHA256SUMS" \
            --title "BarPocket ${VERSION}" \
            --generate-notes
